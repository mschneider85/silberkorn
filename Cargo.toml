[workspace]
resolver = "3"
members = ["crates/sk-core", "crates/sk-app", "crates/sk-ai"]

[workspace.package]
edition = "2024"
version = "0.2.9"
license = "MIT"

[profile.dev]
opt-level = 1
# Line numbers for backtraces are enough; full debug info made target/debug grow to ~50 GB.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# The pipeline is too slow unoptimized: the tests (and the app in dev builds) push real raw files
# through it. Rebuilding sk-core after a change still takes only seconds.
[profile.dev.package.sk-core]
opt-level = 3

[profile.release]
# Symbols are ~25 % of the binary, but guard.rs writes backtraces to the crash log and needs
# them for function names. "debuginfo" drops only the debug info and keeps the symbol table.
strip = "debuginfo"

# For builds that are handed out: `cargo build --profile dist`, output in target/dist.
# Fat LTO shrinks the binary by about a quarter but makes every build take minutes (full build ~14 min).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
# panic stays "unwind": jobs.rs/guard.rs use catch_unwind for cancellation and crash recovery.
