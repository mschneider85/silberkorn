[workspace]
resolver = "3"
members = ["crates/sk-core", "crates/sk-app", "crates/sk-ai"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[profile.dev]
opt-level = 1
# Line numbers for backtraces are enough; full debug info made target/debug grow to ~50 GB.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
