[package]
name = "sk-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
sk-ai = { path = "../sk-ai" }
sk-core = { path = "../sk-core" }
eframe = { version = "0.36", features = ["glow"] }
egui = "0.36"
env_logger = "0.11.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
egui-phosphor = "0.14"
rfd = "0.17"
rayon = "1.12.0"

[[bin]]
name = "silberkorn"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
