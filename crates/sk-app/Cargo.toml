[package]
name = "sk-app"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
sk-ai = { version = "0.1.0", path = "../sk-ai" }
sk-core = { version = "0.1.0", path = "../sk-core" }
eframe = { version = "0.36", features = ["glow"] }
egui = "0.36"
env_logger = "0.11.11"
image = { version = "0.25", default-features = false }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"

[[bin]]
name = "silberkorn"
path = "src/main.rs"
