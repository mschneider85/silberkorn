<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151b2b"/>
      <stop offset="1" stop-color="#07090f"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="512" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f8cff" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#2f8cff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2f8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc4ff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#3d8bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7cc4ff" stop-opacity="0.75"/>
    </linearGradient>
    <!-- metallic silver: bright top, dark band below the middle, light again at the bottom -->
    <linearGradient id="silver" x1="0" y1="326" x2="0" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.30" stop-color="#d9dde3"/>
      <stop offset="0.52" stop-color="#8d939c"/>
      <stop offset="0.60" stop-color="#c3c8cf"/>
      <stop offset="0.85" stop-color="#eef0f3"/>
      <stop offset="1" stop-color="#a7adb5"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="edgeglow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#halo)"/>
  <!-- neon edge: a soft glow plus a thin line -->
  <rect class="fx" x="44" y="44" width="936" height="936" rx="205" fill="none" stroke="#3d8bff" stroke-opacity="0.55" stroke-width="10" filter="url(#edgeglow)"/>
  <rect x="44" y="44" width="936" height="936" rx="205" fill="none" stroke="url(#edge)" stroke-width="6"/>
  <!-- the "s" -->
  <path id="s" d="M648 392 C616 356 568 340 512 340 C440 340 390 372 390 424 C390 478 448 494 512 510 C582 528 636 548 636 602 C636 656 584 684 512 684 C450 684 400 666 368 628" fill="none" stroke-width="96" stroke-linecap="butt"/>
  <use class="fx" xlink:href="#s" stroke="#3d8bff" stroke-opacity="0.8" filter="url(#glow)"/>
  <use xlink:href="#s" stroke="#0a0d14" stroke-width="112"/>
  <use xlink:href="#s" stroke="url(#silver)"/>
</svg>
