[package]
name = "sk-ai"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
sk-core = { path = "../sk-core" }
image = { version = "0.25", default-features = false }
flate2 = "1"
log = "0.4"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "directml", "api-17"] }
bytemuck = "1.25"
rayon = "1.12.0"
sha2 = "0.10"
tract-onnx = "0.23"
ureq = "3"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1.0.152"
