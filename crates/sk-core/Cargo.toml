[package]
name = "sk-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
epaint_default_fonts = "0.36.2"
flate2 = "1"
half = "2"
lcms2 = { version = "6.2", features = ["static"] }
log = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
rawler = "0.8"
rayon = "1.12.0"
roxmltree = "0.21.1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
base64 = "0.22"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1.0"
# AVIF export (the assembler variant would need nasm on every build machine).
rav1e = { version = "0.8", default-features = false, features = ["threading"] }
avif-serialize = "0.8"
# Lossy WebP export (libwebp, built with cc).
libwebp-sys = "0.14"
serde_json = "1.0.152"
sha2 = "0.10"
ureq = "3"
# Same version as eframe, so it is compiled only once.
wgpu = "30.0.1"

[dev-dependencies]
env_logger = "0.11.11"
